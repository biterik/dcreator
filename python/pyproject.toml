[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydcreator"
version = "2.0.0"
description = "Python wrapper around the dcreator dislocation inserter"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Erik Bitzek" },
]
dependencies = [
    "numpy>=1.22",
]

[project.optional-dependencies]
pyiron = ["pyiron_base>=0.7"]
test   = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pydcreator*"]
